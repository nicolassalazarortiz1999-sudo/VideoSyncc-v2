plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videosync.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.videosync.app"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
